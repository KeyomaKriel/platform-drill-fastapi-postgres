apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: drill-cluster
  region: eu-west-2

nodeGroups:
  - name: drill-nodes
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true    # grants ECR pull permissions
