apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: drill
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: platformdrill
  POSTGRES_USER: platformuser
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: drill
type: Opaque
stringData:
  POSTGRES_PASSWORD: platformpass
