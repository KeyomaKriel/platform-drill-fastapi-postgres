apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-drill-api
  namespace: drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-drill-api
  template:
    metadata:
      labels:
        app: platform-drill-api
    spec:
      serviceAccountName: app-sa
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: platform-drill-api
          image: platform-drill-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: platform-drill-api
  namespace: drill
spec:
  selector:
    app: platform-drill-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
