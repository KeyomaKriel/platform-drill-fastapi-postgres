apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-drill-api-config
  namespace: depop-drill
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: platformdrill
  POSTGRES_USER: platformuser
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-drill-api-secret
  namespace: depop-drill
type: Opaque
stringData:
  POSTGRES_PASSWORD: platformpass