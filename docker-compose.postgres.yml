services:
  postgres:
    image: postgres:16
    container_name: platform-drill-postgres
    environment:
      POSTGRES_DB: platformdrill
      POSTGRES_USER: platformuser
      POSTGRES_PASSWORD: platformpass
    ports:
      - "55432:5432"
    volumes:
      - platform-drill-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platformuser -d platformdrill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platform-drill-postgres-data: